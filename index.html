<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="beep.css">
    <script src="beep.js" defer></script>
    
    
</head>
<body>
    <div class="container">
        <h1>BEEP!</h1>
        <div class="navi">
            <nav>
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="https://anyimchidi.com/#contact">Contact</a>
            </nav>
        </div>
        <div class="balance">
            <p>Balance: $<span id="cash">1000000</span></p> 
        </div>
        <div class="game-container">

            <div class="game">
                <p id="display"><i>Wanna play a new round?</i></p>
        <div class="parameters">
            <h3>cards: <span id="cards"></span></h3>
            <h3>sum: <span id="sums"></span></h3>
        </div>
        <div class="game-buttons">
            <div class="buttons">
                <button onclick="startGame()">Start Game</button>
            </div>
        <div class="buttons">
            <button onclick="drawNewCard()">Draw New Card</button>
        </div>
        <div class="buttons">
                <button onclick="newGame()">New Game</button>
            </div>
        </div>
    </div> 
        <div class="flex-test">
            <h3>Each round will cost you $200,000</h3>
            <h3>Drawing a new card will cost you $100,000</h3>
        </div>
        </div>
        <footer class="site-footer">
            <div class="footer-brand">
                <strong>Beep</strong>
            </div>
            <p>Built by Anyim Chidi</p>
            <a href="https://anyimchidi.com/">Developer portfolio ↗</a>
            <p class="footer-disclaimer">Virtual credits only. No real-money wagering.</p>
        </footer>
    </div>
</body>
</html>
